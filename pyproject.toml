[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pip-table"
version = "0.2.0"
description = "Tabela periódica interativa estilo Fallout / Pip-Boy para TFT touch 800x480, gerada 100% em Python."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Eduardo Gama" }]
keywords = ["fallout", "pip-boy", "periodic-table", "tft", "esp32", "ws2812", "jinja2"]
dependencies = ["jinja2>=3.0"]

[project.scripts]
pip-table-build = "pip_table.builder:main"

[tool.setuptools]
packages = ["pip_table"]

[tool.setuptools.package-data]
pip_table = ["templates/*.j2"]
